<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Magic Brew · Admin</title>
<link rel="icon" type="image/png" href="/img/icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="admin.css">
</head><body>
<div id="root"></div>
<script>
const R = document.getElementById('root');
let token = localStorage.getItem('tok'), S = null, tab = 'dashboard', editing = null, offerEdit = null, qrData = null, xf = null;
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
async function api(url, opt = {}) {
  opt.headers = { ...(opt.headers || {}), Authorization: 'Bearer ' + token };
  if (opt.json) { opt.headers['Content-Type'] = 'application/json'; opt.body = JSON.stringify(opt.json); }
  const r = await fetch('/api/admin' + url, opt);
  if (r.status === 401) { localStorage.removeItem('tok'); token = null; renderLogin(); throw new Error('Session expired'); }
  const d = await r.json().catch(() => ({}));
  if (!r.ok) { alert(d.error || 'Error'); throw new Error(d.error); }
  return d;
}
function flash(msg) {
  document.querySelector('.toast')?.remove();
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t);
  setTimeout(() => t.remove(), 2200);
}

/* ---------- formatting & dates (all in the browser's local time) ---------- */
const cur = () => S.settings.currency;
const money = (n) => cur() + Number(n || 0).toLocaleString('en-IN', { maximumFractionDigits: 2 });
const short = (n) => { const a = Math.abs(n), s = n < 0 ? '-' : ''; return a >= 1e5 ? s + +(a / 1e5).toFixed(1) + 'L' : a >= 1e3 ? s + +(a / 1e3).toFixed(1) + 'k' : s + Math.round(a); };
const pad = (n) => String(n).padStart(2, '0');
const ymd = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const today = () => ymd(new Date());
const parse = (s) => new Date(s + 'T00:00:00');
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return ymd(d); };
const dlabel = (s) => parse(s).toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' });
const dayTitle = (s) => s === today() ? 'Today' : s === addDays(today(), -1) ? 'Yesterday' : parse(s).toLocaleDateString('en-IN', { weekday: 'long' });
const ftime = (d) => new Date(d).toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' });
const odate = (o) => ymd(new Date(o.createdAt));
const sum = (a, f) => a.reduce((s, x) => s + f(x), 0);
const catName = (id) => (S.categories.find((c) => c.id === id) || {}).name || '—';

/* ---------- period filters ---------- */
const F = {
  dash: { p: 'month', from: '', to: '', month: '' },
  orders: { p: 'today', from: '', to: '', month: '', status: 'all' },
  exp: { p: 'month', from: '', to: '', month: '', cat: 'all', type: 'all' },
  menu: { show: 'all' },
};
const PRESETS = [['today', 'Today'], ['yesterday', 'Yesterday'], ['week', 'This Week'], ['month', 'This Month'], ['custom', 'Custom Date']];
function range(f) {
  const t = today();
  if (f.p === 'today') return [t, t];
  if (f.p === 'yesterday') { const y = addDays(t, -1); return [y, y]; }
  if (f.p === 'week') { const m = addDays(t, -((new Date().getDay() + 6) % 7)); return [m, addDays(m, 6)]; }
  if (f.p === 'month') { const a = t.slice(0, 8) + '01'; return [a, monthEnd(t.slice(0, 7))]; }
  const a = f.from || t, b = f.to || a;
  return a <= b ? [a, b] : [b, a];
}
const monthEnd = (ym) => { const [y, m] = ym.split('-').map(Number); return `${ym}-${pad(new Date(y, m, 0).getDate())}`; };
const rangeText = ([a, b]) => a === b ? `<b>${dlabel(a)}</b>` : `<b>${dlabel(a)}</b> – <b>${dlabel(b)}</b>`;
function periodBar(key, extra = '') {
  const f = F[key], [a, b] = range(f);
  return `<div class="filters"><div class="chips">${PRESETS.map(([k, l]) => `<button class="chip ${f.p === k && !(k === 'custom' && f.month) ? 'on' : ''}" data-act="preset" data-k="${key}" data-p="${k}">${l}</button>`).join('')}</div>
  <div class="fields">${f.p === 'custom' && !f.month ? `<label>From<input type="date" value="${a}" data-chg="from" data-k="${key}"></label><label>To<input type="date" value="${b}" data-chg="to" data-k="${key}"></label>` : ''}
  <label>Month<input type="month" value="${f.month}" data-chg="month" data-k="${key}"></label>${extra}</div>
  <div class="range-l">Showing ${rangeText([a, b])}</div></div>`;
}

/* ---------- data helpers ---------- */
const liveOrders = () => S.orders.filter((o) => o.status !== 'cancelled');
function stats(a, b) {
  const os = liveOrders().filter((o) => { const d = odate(o); return d >= a && d <= b; });
  const ex = S.expenses.filter((e) => e.date >= a && e.date <= b);
  const sales = sum(os, (o) => o.total), exp = sum(ex, (e) => e.amount);
  return { orders: os.length, sales, exp, profit: sales - exp, paid: sum(os.filter((o) => o.payment.status === 'paid'), (o) => o.total) };
}
// time buckets for charts: days for ranges up to ~3 months, otherwise months
function buckets(a, b) {
  const days = Math.round((parse(b) - parse(a)) / 864e5) + 1, keys = [];
  if (days <= 92) {
    for (let i = 0; i < days; i++) keys.push(addDays(a, i));
    return { keys, keyOf: (s) => s, label: (k, i) => (i === 0 || k.endsWith('-01') ? `${+k.slice(8)} ${parse(k).toLocaleDateString('en-IN', { month: 'short' })}` : String(+k.slice(8))), full: dlabel };
  }
  for (let m = a.slice(0, 7); m <= b.slice(0, 7); m = addDays(monthEnd(m), 1).slice(0, 7)) keys.push(m);
  return { keys, keyOf: (s) => s.slice(0, 7), label: monthLabel, full: monthLabel };
}
const monthLabel = (k) => parse(k + '-01').toLocaleDateString('en-IN', { month: 'short', year: '2-digit' });
function series(a, b, bk) {
  const sales = {}, exp = {};
  liveOrders().forEach((o) => { const d = odate(o); if (d >= a && d <= b) sales[bk.keyOf(d)] = (sales[bk.keyOf(d)] || 0) + o.total; });
  S.expenses.forEach((e) => { if (e.date >= a && e.date <= b) exp[bk.keyOf(e.date)] = (exp[bk.keyOf(e.date)] || 0) + e.amount; });
  return { sales: bk.keys.map((k) => sales[k] || 0), exp: bk.keys.map((k) => exp[k] || 0) };
}

/* ---------- charts (dependency-free SVG) ---------- */
const C_SALES = 'var(--sales)', C_EXP = 'var(--exp)', C_PROFIT = 'var(--profit)';
function nice(max, min) {
  const raw = ((max - min) || 1) / 4, mag = 10 ** Math.floor(Math.log10(raw)), n = raw / mag;
  const step = (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * mag;
  return { lo: Math.floor(min / step + 1e-9) * step, hi: Math.ceil(max / step - 1e-9) * step, step };
}
function chart({ labels, full, series: ss, kind = 'bar' }) {
  const all = ss.flatMap((s) => s.vals);
  if (!all.some((v) => v !== 0)) return '<div class="nodata">No data for this period</div>';
  const W = 420, H = 220, L = 40, Rr = 6, T = 10, B = 26, iw = W - L - Rr, ih = H - T - B;
  const { lo, hi, step } = nice(Math.max(0, ...all), Math.min(0, ...all));
  const y = (v) => T + ih - ((v - lo) / (hi - lo)) * ih;
  let g = '';
  for (let i = 0, n = Math.round((hi - lo) / step); i <= n; i++) {
    const v = lo + i * step;
    g += `<line class="${Math.abs(v) < 1e-9 ? 'zero-l' : 'grid-l'}" x1="${L}" x2="${W - Rr}" y1="${y(v)}" y2="${y(v)}"/><text x="${L - 6}" y="${y(v) + 3}" text-anchor="end">${short(v)}</text>`;
  }
  const n = labels.length, gw = iw / n, cx = (i) => L + gw * i + gw / 2, skip = Math.ceil(n / 8);
  let body = '';
  if (kind === 'bar') {
    const bw = Math.min(22, (gw * 0.8) / ss.length);
    ss.forEach((s, si) => s.vals.forEach((v, i) => {
      if (!v) return;
      const x = cx(i) - (bw * ss.length) / 2 + si * bw, top = y(Math.max(v, 0)), h = Math.max(1.5, Math.abs(y(v) - y(0)));
      body += `<rect class="bar" x="${x + 0.5}" y="${top}" width="${Math.max(1, bw - 1)}" height="${h}" rx="2" fill="${s.color}"><title>${esc(full[i])} · ${s.name}: ${money(v)}</title></rect>`;
    }));
  } else {
    ss.forEach((s) => {
      const pts = s.vals.map((v, i) => `${cx(i)},${y(v)}`);
      body += `<path d="M${cx(0)},${y(0)} L${pts.join(' L')} L${cx(n - 1)},${y(0)}Z" fill="${s.color}" opacity=".12"/><polyline points="${pts.join(' ')}" fill="none" stroke="${s.color}" stroke-width="2.2" stroke-linejoin="round"/>`;
      if (n <= 45) s.vals.forEach((v, i) => (body += `<circle class="dot" cx="${cx(i)}" cy="${y(v)}" r="3.2" fill="${v < 0 ? 'var(--bad)' : s.color}" stroke="#fff" stroke-width="1"><title>${esc(full[i])} · ${s.name}: ${money(v)}</title></circle>`));
    });
  }
  const xl = labels.map((l, i) => (i % skip ? '' : `<text x="${cx(i)}" y="${H - 8}" text-anchor="middle">${esc(l)}</text>`)).join('');
  const legend = ss.length > 1 ? `<div class="legend">${ss.map((s) => `<span><i style="background:${s.color}"></i>${s.name}</span>`).join('')}</div>` : '';
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${ss.map((s) => s.name).join(', ')} chart">${g}${body}${xl}</svg>${legend}`;
}
const chartCard = (title, sub, inner) => `<div class="card ch"><h3>${title}</h3><div class="sub">${sub}</div>${inner}</div>`;

/* ---------- login ---------- */
function renderLogin(err = '') {
  let pin = '';
  R.innerHTML = `<div class="login"><div class="box"><h2>☕ Owner Login</h2><p class="err" id="pe">${esc(err)}</p>
  <div class="dots" id="dots">○○○○</div>
  <div class="kb">${[1, 2, 3, 4, 5, 6, 7, 8, 9, 'C', 0, '⌫'].map((k) => `<button type="button" data-p="${k}">${k}</button>`).join('')}</div>
  <p><a href="#" id="usepw">Use password instead</a></p></div></div>`;
  const dots = document.getElementById('dots'), pe = document.getElementById('pe');
  const show = () => (dots.textContent = '●'.repeat(pin.length) + '○'.repeat(4 - pin.length));
  R.querySelector('.kb').onclick = async (e) => {
    const k = e.target.dataset && e.target.dataset.p; if (k === undefined) return;
    pe.textContent = '';
    pin = k === 'C' ? '' : k === '⌫' ? pin.slice(0, -1) : (pin + k).slice(0, 4);
    show();
    if (pin.length < 4) return;
    const r = await fetch('/api/admin/pin-login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ pin }) });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) { pin = ''; show(); pe.textContent = d.error || 'Failed'; return; }
    token = d.token; localStorage.setItem('tok', token); refresh();
  };
  document.getElementById('usepw').onclick = (e) => { e.preventDefault(); renderPasswordLogin(); };
}
function renderPasswordLogin(err = '') {
  R.innerHTML = `<div class="login"><div class="box"><h2>☕ Owner Login</h2><p class="err">${esc(err)}</p>
  <input id="pw" type="text" class="masked" placeholder="Admin password" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" autofocus>
  <label class="chk" style="justify-content:center"><input type="checkbox" id="showpw"> Show password</label><br><button class="btn fill wide" id="login">Log in</button></div></div>`;
  fetch('/api/admin/local-login').then((r) => r.json()).then((d) => {
    if (!d.available) return;
    const b = document.createElement('button');
    b.className = 'btn wide'; b.style.marginTop = '10px'; b.textContent = 'Continue as owner (this computer only)';
    b.onclick = async () => { token = (await (await fetch('/api/admin/local-login', { method: 'POST' })).json()).token; localStorage.setItem('tok', token); refresh(); };
    document.getElementById('login').after(b);
  }).catch(() => {});
  document.getElementById('showpw').onchange = (e) => document.getElementById('pw').classList.toggle('masked', !e.target.checked);
  document.getElementById('pw').focus();
  const doLogin = async () => {
    const r = await fetch('/api/admin/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: document.getElementById('pw').value }) });
    if (!r.ok) return renderLogin('Wrong password');
    token = (await r.json()).token; localStorage.setItem('tok', token); refresh();
  };
  document.getElementById('login').onclick = doLogin;
  document.getElementById('pw').onkeydown = (e) => e.key === 'Enter' && doLogin();
}

/* ---------- shell ---------- */
const TABS = [
  ['dashboard', '📊', 'Dashboard', 'How the café is doing'],
  ['orders', '📦', 'Orders', 'Browse and manage orders by date'],
  ['menu', '🍔', 'Menu', 'Items, prices and what customers can see'],
  ['offers', '🎁', 'Offers', 'Special prices shown to customers'],
  ['expenses', '💸', 'Expenses', 'Daily purchases and monthly bills'],
  ['payments', '💳', 'Payments', 'Verify customer payments'],
  ['categories', '🗂️', 'Categories', 'Rename, reorder and remove sections'],
  ['qr', '🔳', 'Café QR', 'Printable QR for your menu'],
  ['settings', '⚙️', 'Settings', 'Café details, WhatsApp and UPI'],
];
const VIEWS = () => ({ dashboard, orders: ordersTab, menu, offers, expenses, payments, categories, qr, settings });
async function refresh(quiet) {
  if (!token) return renderLogin();
  const sig = () => S && JSON.stringify([S.orders, S.expenses]);
  const before = sig();
  S = await api('/state');
  if (quiet && before === sig()) return;      // nothing new: don't disturb what the owner is doing
  draw();
}
function draw() {
  const pend = S.orders.filter((o) => o.status === 'new').length, cur_ = TABS.find((t) => t[0] === tab);
  R.innerHTML = `<div class="app"><aside class="side"><div class="brand"><span class="logo">☕</span><div><b>${esc(S.settings.cafeName)}</b><small>Admin panel</small></div></div>
  <nav class="nav">${TABS.map(([k, ic, l]) => `<button class="nb ${tab === k ? 'on' : ''}" data-act="tab" data-t="${k}"><span class="ic">${ic}</span>${l}${k === 'orders' && pend ? `<span class="cnt">${pend}</span>` : ''}</button>`).join('')}</nav>
  <div class="spacer"></div><button class="logout" data-act="logout">Log out</button></aside>
  <main class="main"><div class="ph"><div><h1>${cur_[2]}</h1><p>${cur_[3]}</p></div><div id="ph-r"></div></div><div id="body">${VIEWS()[tab]()}</div></main></div>`;
  const hook = AFTER[tab]; if (hook) hook(document.getElementById('body'));
}

/* ---------- Dashboard ---------- */
const kpi = (cls, ic, label, val, sub = '', extra = '') => `<div class="kpi ${cls} ${extra}"><span class="k-i">${ic}</span><span class="k-l">${label}</span><span class="k-v">${val}</span><span class="k-s">${sub || '&nbsp;'}</span></div>`;
const profitKpi = (label, p) => kpi('profit', '📊', label, (p < 0 ? '−' : '') + money(Math.abs(p)), p < 0 ? 'Loss' : p > 0 ? 'Profit' : 'Break-even', p < 0 ? 'neg' : p > 0 ? 'pos' : '');
function dashboard() {
  const t = today(), td = stats(t, t), mo = stats(t.slice(0, 8) + '01', monthEnd(t.slice(0, 7)));
  const allOrders = liveOrders().length, cancelled = S.orders.length - allOrders, waiting = S.orders.filter((o) => o.status === 'new').length;
  const hiddenCats = S.categories.filter((c) => c.hidden).length, hiddenItems = S.items.filter((i) => i.hidden || catHidden(i)).length;
  const activeOffers = S.offers.filter((o) => offerState(o)[2] === 'live').length;
  const [pa, pb] = range(F.dash), ps = stats(pa, pb), bk = buckets(pa, pb), se = series(pa, pb, bk);
  const labels = bk.keys.map(bk.label), full = bk.keys.map(bk.full), profitVals = se.sales.map((v, i) => v - se.exp[i]);
  // last 6 months, always
  const mKeys = []; for (let i = 5; i >= 0; i--) { const d = new Date(); d.setDate(1); d.setMonth(d.getMonth() - i); mKeys.push(ymd(d).slice(0, 7)); }
  const m6 = mKeys.map((k) => stats(k + '-01', monthEnd(k)));
  const byCat = {}; S.expenses.filter((e) => e.date >= pa && e.date <= pb).forEach((e) => (byCat[e.category] = (byCat[e.category] || 0) + e.amount));
  const cats = Object.entries(byCat).sort((x, y) => y[1] - x[1]), catMax = cats[0] ? cats[0][1] : 1;
  return `${!S.settings.ownerWhatsApp ? '<div class="alert">⚠️ Set your WhatsApp number in Settings to receive order notifications.</div>' : ''}
  ${!S.settings.upiId && !S.settings.paymentQrImage ? '<div class="alert">⚠️ Add your UPI ID or payment QR in Settings so customers can pay.</div>' : ''}
  <div class="sec-t"><h2>Today · ${dlabel(t)}</h2></div>
  <div class="grid">${kpi('sales', '💰', "Today's Sales", money(td.sales), `${money(td.paid)} verified paid`)}${kpi('ord', '📦', "Today's Orders", td.orders, waiting ? `${waiting} new, waiting` : 'No orders waiting')}
  ${kpi('exp', '💸', "Today's Expenses", money(td.exp))}${profitKpi("Today's Profit", td.profit)}</div>
  <div class="sec-t"><h2>This month · ${parse(t).toLocaleDateString('en-IN', { month: 'long', year: 'numeric' })}</h2></div>
  <div class="grid">${kpi('sales', '💰', 'Monthly Sales', money(mo.sales), `${mo.orders} orders`)}${kpi('exp', '💸', 'Monthly Expenses', money(mo.exp))}${profitKpi('Monthly Profit', mo.profit)}
  ${kpi('ord', '📦', 'Total Orders', allOrders, cancelled ? `all time · ${cancelled} cancelled` : 'all time')}</div>
  <div class="sec-t"><h2>Manage</h2></div>
  <div class="grid g3">
    <button class="kpi tile ord" data-act="tab" data-t="orders"><span class="k-go">→</span><span class="k-i">📦</span><span class="k-l">Orders</span><span class="k-v">${waiting} new</span><span class="k-s">${allOrders} orders in total</span></button>
    <button class="kpi tile" data-act="tab" data-t="menu"><span class="k-go">→</span><span class="k-i">🍔</span><span class="k-l">Menu</span><span class="k-v">${S.items.length - hiddenItems} live items</span><span class="k-s">${hiddenItems || hiddenCats ? `${hiddenItems} item${hiddenItems === 1 ? '' : 's'} hidden${hiddenCats ? ` · ${hiddenCats} section${hiddenCats === 1 ? '' : 's'} hidden` : ''}` : 'Nothing hidden'}</span></button>
    <button class="kpi tile" data-act="tab" data-t="offers"><span class="k-go">→</span><span class="k-i">🎁</span><span class="k-l">Offers</span><span class="k-v">${activeOffers} active</span><span class="k-s">${S.offers.length} offer${S.offers.length === 1 ? '' : 's'} created</span></button></div>
  <div class="sec-t"><h2>Business performance</h2></div>
  ${periodBar('dash')}
  <div class="grid">${kpi('sales', '💰', 'Sales', money(ps.sales))}${kpi('ord', '📦', 'Orders', ps.orders)}${kpi('exp', '💸', 'Expenses', money(ps.exp))}${profitKpi('Profit', ps.profit)}</div>
  <div class="grid charts" style="margin-top:12px">
  ${chartCard('Daily sales &amp; expenses', bk.keyOf === undefined ? '' : (bk.keys.length && bk.keys[0].length === 7 ? 'Per month' : 'Per day') + ' · selected period', chart({ labels, full, series: [{ name: 'Sales', color: C_SALES, vals: se.sales }, { name: 'Expenses', color: C_EXP, vals: se.exp }] }))}
  ${chartCard('Profit trend', 'Sales − expenses · selected period', chart({ kind: 'line', labels, full, series: [{ name: 'Profit', color: C_PROFIT, vals: profitVals }] }))}
  ${chartCard('Monthly sales, expenses &amp; profit', 'Last 6 months', chart({ labels: mKeys.map(monthLabel), full: mKeys.map(monthLabel), series: [{ name: 'Sales', color: C_SALES, vals: m6.map((m) => m.sales) }, { name: 'Expenses', color: C_EXP, vals: m6.map((m) => m.exp) }, { name: 'Profit', color: C_PROFIT, vals: m6.map((m) => m.profit) }] }))}
  <div class="card ch"><h3>Where the money goes</h3><div class="sub">Expenses by category · selected period</div>${cats.length ? `<div class="bars">${cats.map(([c, v]) => `<div class="b-r"><span>${esc(c)}</span><span class="b-t"><i style="width:${Math.max(3, (v / catMax) * 100)}%"></i></span><span class="b-v">${money(v)}</span></div>`).join('')}</div>` : '<div class="nodata">No expenses in this period</div>'}</div></div>
  <div class="sec-t"><h2>Latest orders</h2><button class="btn sm" data-act="tab" data-t="orders">View all</button></div>
  ${S.orders.slice(0, 4).map(orderCard).join('') || '<div class="card empty"><span class="big">🧾</span>No orders yet.</div>'}`;
}

/* ---------- Orders ---------- */
const STAT = ['new', 'preparing', 'ready', 'completed', 'cancelled'];
const NEXT = { new: ['preparing', 'Start preparing'], preparing: ['ready', 'Mark ready'], ready: ['completed', 'Complete'] };
const STAT_CLS = { new: 'warn', preparing: 'info', ready: 'ok', completed: 'gray', cancelled: 'bad' };
function orderCard(o) {
  const p = o.payment.status, nx = NEXT[o.status];
  const pb = p === 'paid' ? '<span class="badge ok">Paid ✓</span>' : p === 'reported' ? '<span class="badge warn">Customer says paid · verify</span>' : '<span class="badge gray">Unpaid</span>';
  return `<div class="oc s-${o.status}"><div class="oc-h"><div><b>#${o.id} · ${esc(o.customer.name)}</b><div class="oc-meta">${ftime(o.createdAt)} · ${esc(o.customer.mobile)}</div></div><span class="oc-total">${money(o.total)}</span></div>
  <div class="oc-items">${o.items.map((i) => `<div><span>${i.qty} × ${esc(i.name)}</span><span class="muted">${money(i.price * i.qty)}</span></div>`).join('')}</div>
  ${o.notes ? `<div class="oc-note">📝 ${esc(o.notes)}</div>` : ''}
  <div class="oc-f"><div class="acts"><span class="badge ${STAT_CLS[o.status]}">${o.status}</span>${pb}${o.payment.txnId ? `<small>Txn: ${esc(o.payment.txnId)}</small>` : ''}</div>

/* ---------- Offers ---------- */
const BADGES = ['OFFER', 'NEW', 'LIMITED TIME'];
// -> [label, badge class, state key]
function offerState(o) {
  const it = S.items.find((i) => i.id === o.itemId);
  if (!it) return ['Item removed', 'gray', 'gone'];
  if (!o.active) return ['Paused', 'gray', 'paused'];
  if (o.endDate && o.endDate < today()) return ['Expired', 'bad', 'expired'];
  if (!(o.offerPrice < it.price)) return ['Not live · price ≥ regular', 'warn', 'bad'];
  if (it.hidden || catHidden(it)) return ['Active · item hidden', 'warn', 'live'];
  return ['Live', 'ok', 'live'];
}
const pct = (it, o) => Math.round((1 - o.offerPrice / it.price) * 100);
function offerForm() {
  const o = offerEdit === 'new' ? { active: true, badge: 'OFFER' } : S.offers.find((x) => x.id === offerEdit) || {};

/* ---------- Expenses ---------- */
const DAILY_CATS = ['Bread', 'Eggs', 'Chicken', 'Milk', 'Vegetables', 'Other ingredients', 'Packaging / material', 'Other'];
const MONTHLY_CATS = ['Rent', 'Electricity', 'Internet', 'Staff salary', 'Maintenance', 'Other'];
const newXf = (keep = {}) => ({ id: '', type: 'daily', category: '', amount: '', date: today(), note: '', ...keep });
const catsFor = (type, extra) => { const l = [...(type === 'monthly' ? MONTHLY_CATS : DAILY_CATS)]; if (extra && !l.includes(extra)) l.unshift(extra); return l; };
function expenses() {
  xf = xf || newXf();
  if (!xf.category || (!catsFor(xf.type, xf.id ? xf.category : '').includes(xf.category))) xf.category = catsFor(xf.type)[0];
  const f = F.exp, [a, b] = range(f);
  const allCats = [...new Set([...DAILY_CATS, ...MONTHLY_CATS, ...S.expenses.map((e) => e.category)])];
  let list = S.expenses.filter((e) => e.date >= a && e.date <= b);
  if (f.cat !== 'all') list = list.filter((e) => e.category === f.cat);
  if (f.type !== 'all') list = list.filter((e) => e.type === f.type);
  list.sort((x, y) => (y.date > x.date ? 1 : y.date < x.date ? -1 : (y.createdAt || '') > (x.createdAt || '') ? 1 : -1));
  const tot = sum(list, (e) => e.amount), dTot = sum(list.filter((e) => e.type === 'daily'), (e) => e.amount), mTot = tot - dTot;
  const days = {}; list.forEach((e) => (days[e.date] = days[e.date] || []).push(e));
  const extra = `<label>Category<select data-chg="xcat"><option value="all">All</option>${allCats.map((c) => `<option ${f.cat === c ? 'selected' : ''}>${esc(c)}</option>`).join('')}</select></label>
  <label>Type<select data-chg="xtype"><option value="all">All</option><option value="daily" ${f.type === 'daily' ? 'selected' : ''}>Daily</option><option value="monthly" ${f.type === 'monthly' ? 'selected' : ''}>Monthly</option></select></label>`;
  return `<div class="card" id="xform"><h3>${xf.id ? 'Edit expense' : 'Add expense'}</h3>
  <div class="seg" role="group" aria-label="Expense type"><button class="${xf.type === 'daily' ? 'on' : ''}" data-act="xtype" data-v="daily">Daily</button><button class="${xf.type === 'monthly' ? 'on' : ''}" data-act="xtype" data-v="monthly">Monthly</button></div>
  <div class="two"><div><label>Category</label><select data-xf="category">${catsFor(xf.type, xf.id ? xf.category : '').map((c) => `<option ${xf.category === c ? 'selected' : ''}>${esc(c)}</option>`).join('')}</select></div>
  <div><label>Amount (${cur()})</label><input type="number" min="0" step="0.01" inputmode="decimal" data-xf="amount" value="${esc(xf.amount)}" placeholder="0"></div></div>
  <div class="two"><div><label>Date</label><input type="date" data-xf="date" value="${esc(xf.date)}"></div>
  <div><label>Note (optional)</label><input data-xf="note" maxlength="200" value="${esc(xf.note)}" placeholder="e.g. 5 kg chicken from Sharma Traders"></div></div>
  <div class="acts" style="margin-top:16px"><button class="btn fill" data-act="x-save">${xf.id ? 'Update expense' : 'Add expense'}</button>${xf.id ? '<button class="btn" data-act="x-cancel">Cancel</button>' : ''}</div></div>
  ${periodBar('exp', extra)}
  <div class="grid">${kpi('exp', '💸', 'Total Expenses', money(tot), `${list.length} entr${list.length === 1 ? 'y' : 'ies'}`)}${kpi('exp', '🛒', 'Daily', money(dTot))}${kpi('exp', '🏠', 'Monthly', money(mTot))}</div>
  ${Object.keys(days).sort().reverse().map((d) => `<div class="day"><h3>${dayTitle(d)} <small>· ${dlabel(d)}</small></h3><span>Total <b>${money(sum(days[d], (e) => e.amount))}</b></span></div>
  <div class="card flush">${days[d].map((e) => `<div class="ex"><div class="ex-m"><span><b>${esc(e.category)}</b> <span class="badge ${e.type === 'monthly' ? 'info' : 'gray'}">${e.type}</span></span>${e.note ? `<small>${esc(e.note)}</small>` : ''}</div>
  <span class="ex-amt">${money(e.amount)}</span><span class="acts"><button class="btn sm" data-act="x-ed" data-id="${e.id}">Edit</button><button class="btn sm danger" data-act="x-rm" data-id="${e.id}">Delete</button></span></div>`).join('')}</div>`).join('')
  || '<div class="card empty"><span class="big">🧾</span>No expenses for this selection.</div>'}`;
}

/* ---------- events ---------- */
const body = () => document.getElementById('body');
const orderById = (id) => S.orders.find((o) => o.id === +id);
const putOrder = async (id, json) => { await api('/orders/' + id, { method: 'PUT', json }); refresh(); };
const ACT = {
  tab: (el) => { tab = el.dataset.t; editing = null; offerEdit = null; window.scrollTo(0, 0); draw(); },
  logout: () => { localStorage.removeItem('tok'); token = null; renderLogin(); },
  preset: (el) => {

    if (p === 'custom') { const [a, b] = range(f); f.from = a; f.to = b; }

  // orders
  os: (el) => putOrder(el.dataset.id, { status: el.dataset.s }),
  pay: (el) => putOrder(el.dataset.id, { paymentStatus: 'paid' }),
  clearorders: async () => {
    const n = S.orders.length;
    if (!n || prompt(`This permanently deletes all ${n} orders and cannot be undone.\nType DELETE to confirm.`) !== 'DELETE') return;
    await api('/orders', { method: 'DELETE', json: { confirm: 'DELETE' } });
    flash('All orders cleared ✓'); refresh();
  },
  wa: async (el) => { const l = await api(`/orders/${el.dataset.id}/whatsapp`); window.open(orderById(el.dataset.id).payment.status === 'unpaid' ? l.order : l.payment, '_blank'); },
  // menu
  add: () => { if (!S.categories.length) return alert('Add a category first'); editing = 'new'; draw(); },
  ed: (el) => { editing = el.dataset.id; draw(); },
  mshow: (el) => { F.menu.show = el.dataset.v; draw(); },
  tg: async (el) => { const it = S.items.find((i) => i.id === el.dataset.id); await api('/items/' + it.id, { method: 'PUT', json: { available: !it.available } }); refresh(); },
  hv: async (el) => { const it = S.items.find((i) => i.id === el.dataset.id); await api('/items/' + it.id, { method: 'PUT', json: { hidden: !it.hidden } }); flash(it.hidden ? `${it.name} is visible again` : `${it.name} hidden from customers`); refresh(); },
  hc: async (el) => { const c = S.categories.find((x) => x.id === el.dataset.id); await api('/categories/' + c.id, { method: 'PUT', json: { hidden: !c.hidden } }); flash(c.hidden ? `${c.name} is visible again` : `${c.name} hidden from customers`); refresh(); },
  rm: async (el) => { if (el.dataset.armed) { await api('/items/' + el.dataset.id, { method: 'DELETE' }); return refresh(); } el.dataset.armed = 1; el.textContent = 'Confirm delete?'; },
  'i-cancel': () => { editing = null; draw(); },
  'i-save': async () => {
    const b = body(), fd = new FormData();
    fd.append('name', b.querySelector('#i-name').value); fd.append('price', b.querySelector('#i-price').value);
    fd.append('categoryId', b.querySelector('#i-cat').value); fd.append('description', b.querySelector('#i-desc').value);
    fd.append('available', b.querySelector('#i-av').checked); fd.append('hidden', b.querySelector('#i-hid').checked);
    const f = b.querySelector('#i-img').files[0]; if (f) fd.append('image', f);
    const rm = b.querySelector('#i-rm'); if (rm && rm.checked) fd.append('removeImage', 'true');
    await api(editing === 'new' ? '/items' : '/items/' + editing, { method: editing === 'new' ? 'POST' : 'PUT', body: fd });
    editing = null; flash('Saved ✓'); refresh();
  },
  // categories
  ac: async () => { const v = body().querySelector('#nc').value; if (v.trim()) { await api('/categories', { method: 'POST', json: { name: v } }); refresh(); } },
  sv: async (el) => { await api('/categories/' + el.dataset.id, { method: 'PUT', json: { name: body().querySelector(`[data-cn="${el.dataset.id}"]`).value } }); flash('Renamed ✓'); refresh(); },
  dc: async (el) => { if (confirm('Delete this category?')) { await api('/categories/' + el.dataset.id, { method: 'DELETE' }); refresh(); } },
  up: (el) => swapCat(el.dataset.id, -1), dn: (el) => swapCat(el.dataset.id, 1),
  // offers
  'o-new': () => { offerEdit = 'new'; draw(); },
  'o-ed': (el) => { offerEdit = el.dataset.id; draw(); },
  'o-cancel': () => { offerEdit = null; draw(); },
  'o-rm': async (el) => { if (el.dataset.armed) { await api('/offers/' + el.dataset.id, { method: 'DELETE' }); flash('Offer removed'); return refresh(); } el.dataset.armed = 1; el.textContent = 'Confirm remove?'; },
  'o-save': async () => {
    const b = body(), json = { itemId: b.querySelector('#o-item').value, offerPrice: b.querySelector('#o-price').value, badge: b.querySelector('#o-badge').value,
      title: b.querySelector('#o-title').value, endDate: b.querySelector('#o-end').value, active: b.querySelector('#o-act').checked };
    await api(offerEdit === 'new' ? '/offers' : '/offers/' + offerEdit, { method: offerEdit === 'new' ? 'POST' : 'PUT', json });
    offerEdit = null; flash('Offer saved ✓'); refresh();
  },
  // expenses
  xtype: (el) => { xf.type = el.dataset.v; draw(); },
  'x-cancel': () => { xf = newXf({ type: xf.type }); draw(); },
  'x-ed': (el) => { const e = S.expenses.find((x) => x.id === el.dataset.id); xf = { ...newXf(), ...e, amount: String(e.amount) }; draw(); window.scrollTo({ top: 0, behavior: 'smooth' }); },
  'x-rm': async (el) => { if (el.dataset.armed) { await api('/expenses/' + el.dataset.id, { method: 'DELETE' }); if (xf.id === el.dataset.id) xf = newXf(); flash('Expense deleted'); return refresh(); } el.dataset.armed = 1; el.textContent = 'Confirm delete?'; },
  'x-save': async () => {
    if (!(+xf.amount > 0)) return alert('Enter the amount');
    if (!xf.date) return alert('Choose a date');
    const json = { type: xf.type, category: xf.category, amount: xf.amount, date: xf.date, note: xf.note };
    await api(xf.id ? '/expenses/' + xf.id : '/expenses', { method: xf.id ? 'PUT' : 'POST', json });
    xf = newXf({ type: xf.type, date: xf.date }); flash('Expense saved ✓'); refresh();
  },
  // misc
  printqr: () => { const w = window.open(''); w.document.write(`<body style="text-align:center;font-family:Georgia"><h1>${esc(S.settings.cafeName)}</h1><h2>Scan to view menu & order</h2><img src="${qrData.qr}" style="width:420px"><p>${esc(qrData.url)}</p></body>`); w.document.close(); w.print(); },
  rmqr: async () => { await api('/settings/payment-qr', { method: 'DELETE' }); refresh(); },
  's-save': async () => {
    const b = body(), json = {}; ['cafeName', 'tagline', 'publicUrl', 'ownerWhatsApp', 'upiId', 'upiName'].forEach((k) => (json[k] = b.querySelector('#s-' + k).value));
    await api('/settings', { method: 'PUT', json });
    const f = b.querySelector('#s-qr').files[0];
    if (f) { const fd = new FormData(); fd.append('image', f); await api('/settings/payment-qr', { method: 'POST', body: fd }); }
    qrData = null; await refresh(); flash('Settings saved ✓');
  },
};
async function swapCat(id, dir) {
  const l = [...S.categories].sort((a, b) => a.order - b.order), i = l.findIndex((c) => c.id === id), j = i + dir;
  if (j < 0 || j >= l.length) return;
  [l[i], l[j]] = [l[j], l[i]];
  await Promise.all(l.map((c, k) => api('/categories/' + c.id, { method: 'PUT', json: { order: k } })));
  refresh();
}
const CHG = {
  os: (el) => putOrder(el.dataset.id, { status: el.value }),
  ostatus: (el) => { F.orders.status = el.value; draw(); },
  from: (el) => { const f = F[el.dataset.k]; f.p = 'custom'; f.month = ''; f.from = el.value; if (!f.to || f.to < el.value) f.to = el.value; draw(); },
  to: (el) => { const f = F[el.dataset.k]; f.p = 'custom'; f.month = ''; f.to = el.value; if (!f.from || f.from > el.value) f.from = el.value; draw(); },
  month: (el) => {
    const f = F[el.dataset.k];
    if (!el.value) { f.p = 'month'; f.month = ''; } else { f.p = 'custom'; f.month = el.value; f.from = el.value + '-01'; f.to = monthEnd(el.value); }
    draw();
  },
  xcat: (el) => { F.exp.cat = el.value; draw(); },
  xtype: (el) => { F.exp.type = el.value; draw(); },
  'o-tg': async (el) => { await api('/offers/' + el.dataset.id, { method: 'PUT', json: { active: el.checked } }); flash(el.checked ? 'Offer is live' : 'Offer paused'); refresh(); },
  opv: offerPreview,
};
document.addEventListener('click', async (e) => {
  const el = e.target.closest('[data-act]');
  if (!el || !ACT[el.dataset.act]) return;
  try { await ACT[el.dataset.act](el, e); } catch (err) { console.error(err); }
});
document.addEventListener('change', async (e) => {
  const x = e.target.dataset.xf; if (x && xf) { xf[x] = e.target.value; return; }
  const el = e.target.closest('[data-chg]');
  if (el && CHG[el.dataset.chg]) try { await CHG[el.dataset.chg](el, e); } catch (err) { console.error(err); }
});
document.addEventListener('input', (e) => {
  const x = e.target.dataset.xf; if (x && xf) xf[x] = e.target.value;
  if (e.target.dataset.inp === 'opv') offerPreview();
});

(async () => {
  const key = new URLSearchParams(location.search).get('key');
  if (key) {
    history.replaceState(null, '', location.pathname);   // don't leave the key in the address bar
    try {
      const r = await fetch('/api/admin/key-login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ key }) });
      if (r.ok) { token = (await r.json()).token; localStorage.setItem('tok', token); }
    } catch {}
  }
  refresh();
})();
// live order updates (only repaints when orders/expenses actually changed)
setInterval(() => { if (token && ['dashboard', 'orders', 'payments'].includes(tab)) refresh(true).catch(() => {}); }, 15000);
</script></body></html>
