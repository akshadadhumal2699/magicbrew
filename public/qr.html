<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Menu QR Code</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
body{padding:24px 16px;text-align:center}
.card2{max-width:420px;margin:0 auto;background:#fff;border-radius:24px;padding:28px 20px;box-shadow:0 4px 24px #5a34202a}
.card2 h1{color:var(--brand);font-size:1.6rem}.card2 h2{font-family:'Poppins',sans-serif;font-weight:400;font-size:1rem;color:var(--muted);margin:6px 0 16px}
.card2 img{width:100%;max-width:340px}
.url{word-break:break-all;color:var(--brand);font-weight:600;font-size:.9rem}
@media print{.noprint{display:none}body{background:#fff}.card2{box-shadow:none}}
</style></head><body>
<div class="card2"><h1 id="n">Magic Brew Café &amp; More</h1><h2>Scan to view our menu &amp; order</h2>
<img id="q" alt="Menu QR code" hidden><p class="url" id="u">Loading…</p>
<button class="primary noprint" onclick="window.print()">Print this QR</button></div>
<script>
fetch('/api/menu-qr').then((r) => r.json()).then((d) => {
  if (!d.qr) throw new Error(d.error || 'failed');
  document.getElementById('n').textContent = d.name;
  const q = document.getElementById('q'); q.src = d.qr; q.hidden = false;
  document.getElementById('u').textContent = d.url;
}).catch((e) => { document.getElementById('u').textContent = 'Could not load QR: ' + e.message; });
</script></body></html>
